name: Update Google Scholar data

on:
  schedule:
    # Once a week, Monday 04:37 UTC (odd minute to avoid the top-of-hour
    # crowd). Scholar 403s GitHub's IP ranges intermittently, so a blocked
    # week leaves the figures a further week old; use "Run workflow" or the
    # local refresh in automation/ to update sooner.
    - cron: "37 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scholar-update
  cancel-in-progress: false

jobs:
  scrape:
    # This file is synced to BOTH repos, but only the public one serves the
    # site, and sync_to_public.py pulls data/scholar.json back from public
    # before regenerating -- so a scrape in the private repo is always
    # discarded. Running it there only doubled the request rate at Scholar
    # from Actions IP ranges. Scholar 403s those ranges intermittently --
    # measured over 10 consecutive days in Sept 2026 the scrape succeeded
    # on 4, so expect the data to be 2-3 days old rather than same-day.
    if: github.repository == 'Kiguli/woodingben.com'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape Google Scholar
        # The script exits 0 even when Scholar blocks (429/CAPTCHA), leaving
        # the existing data files untouched -- stale data beats broken data.
        # On success it rewrites data/scholar.json and regenerates the block
        # between the SCHOLAR:START/END markers in public/index.html.
        run: python scripts/scholar_scrape.py

      - name: Re-render homepage list from CV data
        # The homepage list merges data/publications.json (the CV) into the
        # Scholar rows. Re-render from the saved JSON so CV changes reach the
        # homepage even in weeks when Scholar blocks the scrape above.
        run: python scripts/scholar_scrape.py --from-json

      - name: Commit and push if changed
        run: |
          python3 scripts/activate_pending_dois.py
          git add data/scholar.json public/index.html data/publications.json data/pending-dois.json public/publications/index.html
          if git diff --quiet --cached; then
            echo "No changes to Scholar data; nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: weekly refresh (Scholar data; pending-DOI activation when registered)"
            git push
          fi

      - name: Check data freshness
        # The scrape step stays green when Scholar blocks us, so a run of
        # blocked runs used to go unnoticed. Fail once the data is more than
        # 15 days old (two weekly runs missed), so GitHub emails a failure and the stale figure gets
        # fixed by hand or by the local refresh in automation/.
        run: |
          python3 - <<'PY'
          import json, sys
          from datetime import datetime, timezone
          d = json.load(open("data/scholar.json"))
          fetched = datetime.strptime(d["fetched_at"], "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=timezone.utc)
          age_h = (datetime.now(timezone.utc) - fetched).total_seconds() / 3600
          print(f"Scholar data last fetched {d['fetched_at']} ({age_h:.0f}h ago)")
          if age_h > 15 * 24:
              print(f"::error title=Scholar data stale::Last successful scrape was {age_h/24:.1f} days ago; Scholar is likely blocking GitHub runners. Run automation/scholar-refresh.sh locally or update data/scholar.json by hand.")
              sys.exit(1)
          PY
